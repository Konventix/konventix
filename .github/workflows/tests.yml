name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # The suite runs against PostgreSQL, not SQLite: phpunit.xml overrides
    # DB_DATABASE and nothing else, so the connection stays pgsql. Several
    # tests depend on that on purpose — Resources' exclusion constraints
    # (ADR-0020) and the `UNIQUE NULLS NOT DISTINCT` retention rules have no
    # SQLite equivalent, and a transaction aborted by a constraint violation
    # behaves differently there.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: konventix
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U konventix -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Services are published on the runner itself, so the compose hostnames
      # from .env.example do not resolve here.
      DB_HOST: 127.0.0.1
      DB_DATABASE: testing
      DB_USERNAME: konventix
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql, redis, intl, bcmath, gd, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Before `composer install`, not after. `package:discover` runs as a
      # post-autoload hook and reads config, which reads .env — a package that
      # rejects a missing value fails the install itself rather than failing
      # later, which is exactly how this pipeline broke once already.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install JS dependencies
        run: npm ci

      # Feature tests resolve Inertia pages through the Vite manifest, so the
      # build has to precede the suite or every page test 500s. The SSR bundle
      # is built too: SettingsLayoutTest asserts server-rendered HTML, which
      # only exists when an SSR process answers (config/inertia.php has SSR on
      # by default, ADR-0049 §6) — without it those ten cases fail exactly as
      # they do in a dev container with no SSR running.
      - name: Build frontend
        run: npm run build:ssr

      # Backgrounded with nohup so it outlives this step; the runner reaps it
      # at job end. Inertia falls back to client rendering while it warms up,
      # so the sleep is what makes the first suite request deterministic.
      - name: Start Inertia SSR server
        run: |
          nohup php artisan inertia:start-ssr > ssr.log 2>&1 &
          sleep 3

      # eslint, prettier, vue-tsc, pint, phpstan, and the Pest suite.
      - name: Run CI checks
        run: composer ci:check
