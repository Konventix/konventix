name: image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: konventix
          POSTGRES_USER: konventix
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd="pg_isready -U konventix -d konventix"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/konventix/konventix
          # ADR-0049 §1: immutable tags only. A moving `main` tag would make
          # "which image is running" unanswerable — a push to main is found by
          # its sha tag.
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      # Built once, into the runner's daemon, under the very tags that will be
      # pushed: the image the smoke test boots is byte-for-byte the image that
      # reaches the registry.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The cheapest honest proof the artifact starts: boot it against the
      # job's Postgres/Redis and require /up to answer (ADR-0049 §1).
      #
      # GitHub service containers are reachable under their service name only
      # from other containers on the job's own Docker network, not from the
      # runner host. `docker run` here starts a container outside the job's
      # network, so it needs that network's name resolved at runtime; fall
      # back to bridge if it can't be found. As written, /up contacts neither
      # Postgres nor Redis (AUTO_MIGRATE=false, no DB/cache touch at boot) —
      # the services and their env stay wired up for future-proofing.
      - name: Smoke test
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image=$(echo "$TAGS" | head -n1)
          network=$(docker network ls --format '{{.Name}}' | grep github | head -n1)
          network=${network:-bridge}
          docker run -d --rm --name smoke \
            --network "$network" \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e APP_ENV=production -e APP_DEBUG=false \
            -e DB_HOST=postgres -e DB_DATABASE=konventix -e DB_USERNAME=konventix -e DB_PASSWORD=password \
            -e REDIS_HOST=redis -e SESSION_DRIVER=redis -e CACHE_STORE=redis -e QUEUE_CONNECTION=redis \
            -e INERTIA_SSR_ENABLED=false -e AUTO_MIGRATE=false -e LOG_CHANNEL=stderr \
            "$image"
          for i in $(seq 1 20); do
            docker exec smoke curl -sf http://localhost:8000/up && ok=1 && break
            sleep 3
          done
          # ADR-0049 §5: the bundle must carry no baked websocket endpoint, or
          # every deployment talks to the developer's laptop. `resolveReverbEndpoint`
          # is called with `{host: …, port: …, scheme: …}` filled from
          # VITE_REVERB_*; with them stripped the minifier writes `host:void 0`,
          # with them baked it writes the .env.example value. Matching the pair
          # rather than a bare `localhost` avoids laravel-echo's own hardcoded
          # `wsHost:"localhost"` default and the SSR `hostname:"localhost"`
          # fallback, both of which are in every bundle.
          if docker exec smoke sh -c "grep -rlE 'localhost:8080|host:.?localhost.?,port:' public/build/assets/"; then
            echo "::error::the built bundle contains the dev websocket endpoint"
            docker stop smoke
            exit 1
          fi
          docker logs smoke | tail -40
          docker stop smoke
          test "$ok" = "1"

      # Every metadata tag names the image just smoked — the daemon already
      # holds it, so this only uploads.
      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -n1 docker push
