# Prometheus for the k6 load test (see the `prometheus` service in
# compose.yaml). It scrapes nothing: k6 *pushes* into it over remote write,
# which is why the compose command carries --web.enable-remote-write-receiver.
# The empty scrape_configs is deliberate — this is a sink for one test run,
# not application monitoring (that is Pulse's job, and Pulse has its own
# dashboard and its own ingest drain).
global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs: []
