; Production PHP settings for the runtime image (#254).
;
; Copied to /usr/local/etc/php/conf.d/99-production.ini in the Dockerfile's
; `runtime` stage ONLY. The `toolchain` stage is the published CI image, and
; .gitlab-ci.yml writes its own 99-ci.ini there (memory_limit = -1, needed for
; spatie/laravel-data's type inference); a copy in a shared stage would fight
; that override for no benefit.
;
; The FrankenPHP base image activates neither php.ini-development nor
; php.ini-production, so without this file the runtime ran on PHP's
; compiled-in defaults: display_errors=STDOUT, log_errors=Off, expose_php=On,
; memory_limit=128M, opcache.validate_timestamps=On.

; Under FrankenPHP, display_errors writes PHP's diagnostics into the HTTP
; response body. Laravel's handler catches most of it; what it does not catch
; are the pre-boot and post-handler cases, which is exactly where the state a
; production deployment must not disclose is standing.
display_errors = Off
display_startup_errors = Off

; The other half of the same sentence: with log_errors off, anything Laravel
; does not catch went to the requester and to nobody else. /dev/stderr is what
; the container runtime collects.
log_errors = On
error_log = /dev/stderr

; No `X-Powered-By: PHP/8.5.9` on every response.
expose_php = Off

; CI needed -1 for the same code (spatie/laravel-data's type inference), and
; the Octane workers were running the default 128M. 512M is a ceiling for a
; runaway request, not a working set.
memory_limit = 512M

; The ingress refuses a body over 12m
; (nginx.ingress.kubernetes.io/proxy-body-size). PHP refuses at the same
; number, so the limit the user meets is the application's message rather than
; nginx's error page — and never a limit nobody can reach.
upload_max_filesize = 12M
post_max_size = 12M

; The code in this image cannot change under the running process: it is baked
; at build time and the chart mounts a read-only root filesystem. Revalidating
; timestamps would buy nothing and cost a stat() per file every two seconds.
;
; Safe because the entrypoint's `artisan config:cache` / `route:cache` /
; `view:cache` / `event:cache` calls run as CLI, where opcache is off
; (opcache.enable_cli defaults to 0 and is deliberately not turned on here),
; and they finish before `exec "$@"` starts the server.
; Stated rather than left to the compiled default, because the safety of
; validate_timestamps=0 rests on it and .gitlab-ci.yml's smoke step greps for
; it: an invariant CI enforces belongs in the file it is about.
opcache.enable_cli = 0
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000
opcache.interned_strings_buffer = 32

; The same argument as validate_timestamps: paths under an image whose code
; cannot change do not need re-resolving every two minutes. PHP's compiled
; default is 120 seconds; the buffer size (4096K) is already adequate.
realpath_cache_ttl = 600

; `php.ini-production` ships -1; PHP's compiled-in default is 1, which both
; compiles assertion code into every opcode array and executes it. The code in
; this image is baked at build time, so an `assert()` written for a development
; box can never be the thing that decides what a production request does — and
; -1 is the only value that removes the check rather than merely skipping it,
; because it cannot be raised again at runtime. Runtime image only: CI keeps
; its own 99-ci.ini, where assertions are a development tool worth having.
zend.assertions = -1

; JIT stays off. It is a measurement away from being justified, and no such
; measurement exists for this workload yet (#254 acceptance criterion).
