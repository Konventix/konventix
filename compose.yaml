# Local dev stack. Mirrors the production topology from ADR-0002/ADR-0025:
# ONE application image, one container per deployment role (web, queue worker,
# scheduler, reverb) via command override. Never spawn containers from the
# application (no docker.sock mounts — root-equivalent host access).
services:
    # One-shot migrator role (Kubernetes-Job style): runs `konventix:migrate`
    # once per `up`, before any application role starts (they wait via
    # service_completed_successfully). The gate lives in the artisan command,
    # inside the application image — AUTO_MIGRATE=false makes it exit 0
    # without touching the database.
    migrate:
        image: sail-8.5/app
        command: ['php', 'artisan', 'konventix:migrate']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            AUTO_MIGRATE: '${AUTO_MIGRATE:-true}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
        restart: 'no'

    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # Web role runs FrankenPHP via Octane (ADR-0002), matching the
            # production server. --watch reloads workers on code changes.
            SUPERVISOR_PHP_COMMAND: "/usr/bin/php -d variables_order=EGPCS /var/www/html/artisan octane:start --server=frankenphp --host=0.0.0.0 --admin-port=2019 --port=80 --watch"
            XDG_CONFIG_HOME: /var/www/html/config
            XDG_DATA_HOME: /var/www/html/data
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            migrate:
                condition: service_completed_successfully
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    # Role: queue worker, supervised by Horizon. Horizon reads its own
    # supervisor/retry configuration from config/horizon.php rather than from
    # flags here, which is the whole point of it — one place that describes how
    # the queues are worked, visible in the dashboard.
    #
    # Horizon only supervises Redis queues; `QUEUE_CONNECTION=database` makes
    # this container do nothing at all. Workers still restart on code changes
    # via `sail restart queue`.
    queue:
        image: sail-8.5/app
        command: ['php', 'artisan', 'horizon']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            migrate:
                condition: service_completed_successfully
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Role: Pulse ingest drain. With PULSE_INGEST_DRIVER=redis, Pulse writes
    # entries to a Redis stream instead of into the request's own database
    # transaction; this drains that stream into Postgres. Without it the
    # dashboard is silently empty — the data is being collected and nobody is
    # writing it down, which looks exactly like "Pulse is not working".
    pulse:
        image: sail-8.5/app
        command: ['php', 'artisan', 'pulse:work']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            migrate:
                condition: service_completed_successfully
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Role: scheduler. `schedule:work` runs in the foreground and ticks every
    # minute — the container-native alternative to cron.
    scheduler:
        image: sail-8.5/app
        command: ['php', 'artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            migrate:
                condition: service_completed_successfully
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    # Role: websocket server (ADR-0025). ONE shared Reverb process serving one
    # app entry per brand; the backend reaches it at http://reverb:8080, the
    # browser at ws://localhost:8080.
    reverb:
        image: sail-8.5/app
        command:
            [
                'php',
                'artisan',
                'reverb:start',
                '--host=0.0.0.0',
                '--port=8080',
            ]
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        ports:
            - '${FORWARD_REVERB_PORT:-8080}:8080'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            migrate:
                condition: service_completed_successfully
            laravel.test:
                condition: service_started
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:alpine'
        # ADR-0047 point 6: Redis now backs sessions and cache alongside the
        # queue and the waiting room, so its data must survive a container
        # restart mid-rush — `noeviction` refuses new writes rather than
        # silently dropping a session or a queued ticket once memory fills,
        # and `appendonly yes` persists every write instead of only the
        # point-in-time RDB snapshot.
        command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'yes']
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s

    # S3-compatible object storage for developing against ADR-0043.
    #
    # This used to sit behind a `s3` compose profile. It no longer does:
    # `vendor/bin/sail` has no `--profile` handling anywhere in it (grep the
    # script — it forwards `-f` files via SAIL_FILES and nothing else), so a
    # profile-gated service is unreachable through the command this project
    # actually uses to drive the stack. Garage therefore comes up with every
    # `sail up`. The application still ignores it unless the disks are
    # pointed at S3, so the cost is a container and three host ports, not a
    # behaviour change.
    #
    # `--single-node --default-bucket` applies the cluster layout and creates
    # the first key and bucket from the GARAGE_DEFAULT_* variables at boot
    # (Garage 2.3+); `sail artisan storage:garage-init` adds the second bucket
    # and the website access that makes the public one anonymously readable.
    garage:
        image: 'dxflrs/garage:v2.3.0'
        command: ['/garage', 'server', '--single-node', '--default-bucket']
        environment:
            GARAGE_DEFAULT_ACCESS_KEY: '${AWS_ACCESS_KEY_ID:-GKkonventixdevaccesskey00000000}'
            GARAGE_DEFAULT_SECRET_KEY: '${AWS_SECRET_ACCESS_KEY:-konventixdevsecretkey0000000000000000000000000000000000000000000}'
            GARAGE_DEFAULT_BUCKET: '${AWS_MEDIA_BUCKET:-konventix-public}'
        ports:
            - '${FORWARD_GARAGE_S3_PORT:-3900}:3900'
            - '${FORWARD_GARAGE_WEB_PORT:-3902}:3902'
            - '${FORWARD_GARAGE_ADMIN_PORT:-3903}:3903'
        volumes:
            - './contrib/garage.toml:/etc/garage.toml:ro'
            - 'sail-garage-meta:/var/lib/garage/meta'
            - 'sail-garage-data:/var/lib/garage/data'
        networks:
            sail:
                # Garage's web endpoint picks the bucket from the Host header,
                # matching either `<bucket>.web.garage.localhost` or the bucket
                # alias itself. The browser uses the first form (`.localhost`
                # resolves to loopback, and 3902 is published below); this
                # alias makes the second form resolvable inside the compose
                # network, since a `.localhost` name never leaves the container
                # that asks for it (RFC 6761).
                aliases:
                    - '${AWS_MEDIA_BUCKET:-konventix-public}'

    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail

    # ADR-0047 point 6: the k6 rush against the seeded "Rush" brand
    # (`tests/Load/ticket-rush.js`). `laravel.test` is reached by its compose
    # service name on the `sail` network, at the port FrankenPHP listens on
    # inside the container (80, regardless of `APP_PORT` — that env var only
    # remaps the *host*-side publish); the script sends `Host: rush.localhost`
    # on every request so brand resolution picks the seeded brand rather than
    # 404ing on the bare service name.
    #
    # This is a `run` target, not a server: the default command is `version`,
    # so `sail up` leaves it at Exited (0) having done nothing rather than
    # crash-looping on k6's usage message. The rush is started deliberately,
    # from the host, with
    #
    #   docker compose run --rm k6 run /scripts/ticket-rush.js
    #
    # which overrides that command. `restart: 'no'` for the same reason the
    # `migrate` one-shot has it — a container that is meant to exit must not
    # be brought back.
    #
    # The run streams its metrics into `prometheus` as it goes and you watch
    # it in `grafana` (both below) — `handleSummary` still writes
    # tests/Load/results/summary.json at the end, which is the artefact
    # RushResultTest asserts against. The live dashboard is for seeing
    # *where* a run bends; the summary is what makes it pass or fail.
    #
    # `K6_OUT` here is what wires the two together, so the run command needs
    # no extra flags. Drop the dashboard for one run with `-e K6_OUT=` and k6
    # falls back to stdout only.
    k6:
        image: 'grafana/k6:2.2.0'
        command: ['version']
        restart: 'no'
        environment:
            K6_OUT: '${K6_OUT-experimental-prometheus-rw}'
            K6_PROMETHEUS_RW_SERVER_URL: 'http://prometheus:9090/api/v1/write'
            K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
            # Native histograms make every quantile aggregatable and windowed:
            # histogram_quantile(0.95, sum(rate(k6_http_req_duration_seconds[1m])))
            # answers "p95 over the last minute". Note the `_seconds` suffix
            # and the unit that comes with it — k6 reports milliseconds on
            # stdout but pushes seconds here. k6's alternative output —
            # K6_PROMETHEUS_RW_TREND_STATS gauges — computes its percentiles
            # over the whole run so far, so a spike halfway through never
            # leaves the graph and the line only ever crawls upward. Requires
            # --enable-feature=native-histograms on the Prometheus side.
            #
            # K6_FEATURES, not K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM:
            # k6 2.x still honours that older variable but logs it as a
            # deprecated legacy alias on every run.
            K6_FEATURES: native-histograms
            # Marks every series stale when the run ends, so the dashboard
            # stops at the end of the test instead of drawing the last value
            # forward as a flat line that looks like a hung run.
            K6_PROMETHEUS_RW_STALE_MARKERS: 'true'
        volumes:
            - './tests/Load:/scripts'
        networks:
            - sail
        depends_on:
            prometheus:
                condition: service_healthy

    # Metrics sink for the k6 run: k6 pushes over remote write, nothing is
    # scraped (contrib/prometheus.yml has an empty scrape_configs). Not
    # application monitoring — Pulse already does that, with its own
    # dashboard and its own ingest drain above.
    prometheus:
        image: 'prom/prometheus:v3.7.3'
        command:
            [
                '--config.file=/etc/prometheus/prometheus.yml',
                '--storage.tsdb.path=/prometheus',
                '--storage.tsdb.retention.time=15d',
                '--web.enable-remote-write-receiver',
                '--enable-feature=native-histograms',
            ]
        ports:
            # 9090 is Prometheus's own default and a busy port on developer
            # machines (this one included) — same reason FORWARD_REVERB_PORT
            # exists. Inside the network it is still plain 9090, which is what
            # the k6 remote-write URL and the Grafana data source both use.
            - '${FORWARD_PROMETHEUS_PORT:-9091}:9090'
        volumes:
            - './contrib/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
            - 'sail-prometheus:/prometheus'
        networks:
            - sail
        healthcheck:
            # The image has no shell and no curl; its own binary answers.
            test: ['CMD', 'promtool', 'check', 'healthy', '--url=http://localhost:9090']
            interval: 5s
            retries: 10
            timeout: 3s
        restart: unless-stopped

    # Reads the run. Data source and dashboard are provisioned from
    # contrib/grafana, so `up` lands you on a working "Ticket rush" board at
    # http://localhost:${FORWARD_GRAFANA_PORT:-3000} with no login and no
    # setup wizard. Anonymous admin is a dev-stack convenience and is safe
    # only because this file is never deployed — the production observability
    # story is ADR-0049's, not this one's. Do not copy these two GF_AUTH_*
    # lines anywhere that is reachable from outside a laptop.
    grafana:
        image: 'grafana/grafana:12.3.0'
        environment:
            GF_AUTH_ANONYMOUS_ENABLED: 'true'
            GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
            GF_AUTH_BASIC_ENABLED: 'false'
            # Land straight on the rush dashboard instead of an empty home.
            GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/k6-ticket-rush.json
        ports:
            - '${FORWARD_GRAFANA_PORT:-3000}:3000'
        volumes:
            - './contrib/grafana/provisioning:/etc/grafana/provisioning:ro'
            - './contrib/grafana/dashboards:/var/lib/grafana/dashboards:ro'
            - 'sail-grafana:/var/lib/grafana'
        networks:
            - sail
        depends_on:
            prometheus:
                condition: service_healthy
        restart: unless-stopped

networks:
    sail:
        driver: bridge

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    sail-garage-meta:
        driver: local
    sail-garage-data:
        driver: local
    sail-prometheus:
        driver: local
    sail-grafana:
        driver: local
