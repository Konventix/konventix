# The pipeline is the one instance that sees every change (#59). It runs the
# jobs that prove a commit and name an image, and nothing else runs on its own:
#
#   docs/ branch, with or without MR  ~1 min   the docs-only guard, secrets
#   feature branch, no merge request  ~2 min   format, phpstan, vitest, secrets
#   merge request                     ~8 min   + eslint, vue-tsc, the Pest suite
#   develop, main, any tag           ~16 min   + the image, built beside all of
#                                              that and published after it; a
#                                              tag names it
#
# The scanners — both SAST analyzers, dependency scanning, container scanning
# — and the two gates that read their reports are still here, but every one
# of them is a manual job that fails nothing: it appears in the pipeline with
# a play button, runs when someone presses it, and its verdict is advisory.
# Nothing in the publishing chain waits for one. That is a deliberate trade:
# the cross-file SAST took 27-50 minutes on every candidate and release tag,
# and the release it existed to protect spent two days blocked on three
# findings in browser code (v0.6.4, pipelines 1828 and 1833). Development
# speed won. Run the scans by hand on the tags that reach other people, read
# the security widget, and press the gate to get the old verdict.
#
# develop is the integration branch and the default: feature branches merge into
# it, and it merges into main for a release.
#
# A branch named docs/… is documentation by declaration, and its pipeline is
# the `docs:only` guard plus secret detection. Nothing else in a pipeline knows
# what a change touched, and `rules:changes` cannot say "only these files", so
# a list of code globs on every job would silently skip CI the day someone adds
# a path. The guard is what makes the declaration safe: a non-documentation
# file on a docs/ branch fails the pipeline instead of merging unverified.
#
# The GitHub workflow that published a second, unverified image to
# ghcr.io/konventix/konventix is gone (#255): it fired on exactly the refs this
# pipeline guards, with none of the verification. Here the bar is
# `publish:image`: it needs the verify, analyse and test jobs, and it is the
# only job that writes a tag anything can deploy. `build:image` runs beside
# them instead of behind them (#261) — it builds and smoke-tests, and parks the
# result on a path nothing pulls from, so a red test still means no deployable
# tag was ever written.
#
# Ordering is a DAG, not a ladder: `needs:` is what decides what waits for what,
# so the stage list below is the story the pipeline graph tells, not the order
# it runs in.

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

default:
  # A push that supersedes a pipeline should not leave the old one holding a
  # runner: with several agents in the repository the runners are the scarce
  # resource.
  interruptible: true

stages:
  - prepare
  - verify
  - analyse
  - test
  - scan
  - build
  - publish
  - release

workflow:
  rules:
    # A docs/ branch gets the documentation shape — see `docs:only` below. The
    # branch name is read only here; every job reads the variable.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^docs\//
      variables:
        PIPELINE_SHAPE: docs
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    # Once a merge request is open its pipeline is the one anybody reads, and
    # running both would spend a runner twice on the same commit.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^docs\//
      variables:
        PIPELINE_SHAPE: docs
    # Any other branch push gets the fast lane — see `.tier-0` below.
    - if: $CI_COMMIT_BRANCH

# Which pipelines a job belongs to. Referenced rather than repeated so that a
# job's tier is one line and the tiers stay comparable. Every tier starts by
# stepping aside for the documentation shape (`PIPELINE_SHAPE`, set in
# `workflow:rules`); the jobs with hand-written rules do the same.
.tiers:
  # Everywhere, including a bare feature branch push.
  everywhere: &tier-everywhere
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  # Merge requests and the two long-lived branches — never a bare feature push.
  reviewed: &tier-reviewed
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  # Where an image is published: integration onwards.
  published: &tier-published
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
  # The scanners: present with a play button wherever a review or a publish
  # happens, run by hand, and advisory — `when: manual` in a rule makes the
  # job `allow_failure: true`, so an unplayed or a red scanner leaves the
  # pipeline green and blocks nothing downstream. Every scanner and both
  # gates carry this tier and an explicit `allow_failure: true` beside it,
  # because the security templates set `false` and an override must say so.
  scan: &tier-scan
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual

variables:
  # Dependency caches must live under the project directory — it is the only
  # path GitLab's cache carries between jobs.
  COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.cache/composer
  COMPOSER_NO_INTERACTION: "1"
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm

  # Which shape this pipeline has. `workflow:rules` sets it to `docs` for a
  # docs/ branch; the tiers and the hand-ruled jobs read it, nothing else does.
  PIPELINE_SHAPE: full

  # The security templates skip merge request pipelines unless this is set:
  # every scanner's rules read `$AST_ENABLE_MR_PIPELINES == "true" &&
  # $CI_PIPELINE_SOURCE == "merge_request_event"`. Without it the scans would
  # only ever run on main — after the merge they were supposed to block.
  AST_ENABLE_MR_PIPELINES: "true"
  # PHP and Vue are among the languages GitLab Advanced SAST covers and semgrep
  # then steps aside for (the template excludes them from semgrep's paths when
  # this is on). Ultimate is licensed here; use the better analyzer.
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  # Setting this replaces the template's default (`spec, test, tests, tmp`), so
  # the default is repeated. What is added is not application code: the
  # documentation and agent rules, the verification scripts, the module
  # stubs, storage, the dev seeders, and the generated TypeScript types —
  # every one of them walked by both SAST analyzers before this.
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, docs, .ai, .claude, contrib, stubs, storage, database/seeders, resources/js/types/generated.d.ts"

  # The CI image is the Dockerfile's `toolchain` stage. Bump the tag when that
  # stage changes in a way the published image must reflect immediately —
  # `prepare:toolchain` republishes the tag from main whenever the Dockerfile
  # moves, and merge requests always run on the published one.
  TOOLCHAIN_IMAGE: $CI_REGISTRY_IMAGE/ci-toolchain
  TOOLCHAIN_TAG: php8.5-node22

  # ADR-0049 §1: immutable tags only. A moving `main` tag would make "which
  # image is running" unanswerable — a push to main is found by its sha.
  IMAGE_SHA_TAG: sha-$CI_COMMIT_SHORT_SHA

  # Where a built image waits for the rest of the pipeline to finish (#261).
  # `build:image` no longer runs behind the tests, so its output exists before
  # anything has proven the commit; it goes here, and `publish:image` copies it
  # onto $CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG once every gate is green. Nothing
  # deploys from this path — the chart pins `registry.sxcs.de/konventix/konventix`
  # itself (ADR-0049 §2), and a tag under it only ever appears after the gate.
  # The tag here is per commit, not per branch: two pipelines on develop at
  # once would otherwise promote each other's image.
  UNVERIFIED_IMAGE: $CI_REGISTRY_IMAGE/unverified

.docker:
  image: docker:29.1.4-cli
  services:
    - name: docker:29.1.4-dind
      alias: docker
  variables:
    # dind's TLS certificates live in a volume the job container only sees when
    # the runner is configured to share `/certs/client`; these runners are not,
    # and the client dies on `open /certs/client/ca.pem`. The daemon is reached
    # over the job's private network, which no other pipeline can join.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # The default `docker` driver cannot export a registry cache; a
    # docker-container builder inside dind can, and still `--load`s into the
    # daemon so the smoke test boots the very image that gets pushed.
    - docker buildx create --driver docker-container --name konventix --use
        || docker buildx use konventix

# Naming an image that already exists is a registry operation, not a build:
# `docker buildx imagetools` speaks to the registry directly and `docker login`
# stores its credentials client-side, so neither needs a daemon. The two
# promote jobs take this instead of `.docker` and skip starting a dind service
# and a builder they would never use. Verified against docker:29.1.4-cli with
# no DOCKER_HOST set: `imagetools inspect` answers, `login` fails on
# credentials rather than on a missing daemon.
.registry:
  image: docker:29.1.4-cli
  variables:
    # The runners do not all agree on this. `DOCKER_HOST=tcp://docker:2375`
    # comes from the runner's own environment on some of them, left over from
    # the dind setup `.docker` needs — and beside a job with no dind service
    # the name `docker` resolves through the search domain to a public address
    # that never answers. `docker login` honours DOCKER_HOST even though the
    # login itself is client-side, so it hangs and dies on
    # `dial tcp 194.94.76.76:2375: i/o timeout`.
    #
    # It is a coin flip, not a clean failure: the same job succeeded in 15s on
    # vm-gitlab-runner-3-alpha (pipeline 1689) and failed on
    # ct-gitlab-runner-1-bravo (pipeline 1702). Emptying it here makes the CLI
    # take its client-side path on every runner, which is what these jobs
    # wanted all along — they talk to the registry, never to a daemon.
    DOCKER_HOST: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.cache-pull: &cache-pull
  - key:
      prefix: composer
      files: [composer.lock]
    paths: [.cache/composer]
    policy: pull
  - key:
      prefix: npm
      files: [package-lock.json]
    paths: [.cache/npm]
    policy: pull

# Setup steps, referenced by the job bases below. Each job installs only what it
# runs: `wayfinder:generate` takes four minutes on this codebase, so exactly one
# job pays for it and passes the result on as an artifact.
.setup:
  php:
    # The FrankenPHP base ships PHP's default 128M. spatie/laravel-data's type
    # inference exhausts it partway through the suite, and phpstan needs the
    # headroom too. GitHub's setup-php defaults to -1, which is why tests.yml
    # never had to say this.
    - echo 'memory_limit = -1' > /usr/local/etc/php/conf.d/99-ci.ini
    # `.env` before `composer install`, not after: package:discover runs as a
    # post-autoload hook and reads config, which reads .env — a package that
    # rejects a missing value fails the install itself rather than failing
    # later, which is how the GitHub pipeline broke once already.
    - cp .env.example .env
    - composer install --prefer-dist --no-progress
    - php artisan key:generate
  js:
    - npm ci --no-audit --no-fund

# .env.example points DB_HOST at `pgsql` and REDIS_HOST at `redis` — the compose
# hostnames — and sets CACHE_STORE, SESSION_DRIVER and QUEUE_CONNECTION to redis.
# In a job with no such services those names do not resolve, and every
# `php artisan` boot stalls on them. That is not a small tax: the identical
# `wayfinder:generate --with-form` takes 246s in verify:lint and 3.4s inside
# test:php's Vite build, and `key:generate` 30s against 0.7s. The only
# difference is that test:php has a database and a redis beside it.
#
# So the jobs without services point at a loopback that refuses immediately and
# keep the framework's stores in memory. Nothing here runs application code that
# needs either backend — pint, prettier, eslint, phpstan and route generation
# read files.
.offline-services: &offline-services
  DB_HOST: 127.0.0.1
  REDIS_HOST: 127.0.0.1
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync

.toolchain:
  image:
    name: $TOOLCHAIN_IMAGE:$TOOLCHAIN_TAG
    # The FrankenPHP base carries an entrypoint; the runner needs a plain shell.
    entrypoint: [""]
  cache: *cache-pull

.php:
  extends: .toolchain
  before_script:
    - !reference [.setup, php]

.js:
  extends: .toolchain
  before_script:
    - !reference [.setup, js]

.php-js:
  extends: .toolchain
  before_script:
    - !reference [.setup, php]
    - !reference [.setup, js]

########## prepare ##########

prepare:toolchain:
  stage: prepare
  extends: .docker
  rules:
    # Every pipeline runs this, because every job below needs the image to
    # exist — but only develop and main may republish the tag. One merge
    # request's Dockerfile experiment must not change the image every other
    # pipeline is running on; its own change is still proven by `build:image`,
    # which builds the whole file including this stage. Elsewhere the job is a
    # manifest lookup that exits in about thirty seconds. The documentation
    # shape has no job that runs on the image, so not even the lookup.
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH != "develop"
    - changes: [Dockerfile]
      variables:
        TOOLCHAIN_REBUILD: "yes"
    - when: on_success
  script:
    - |
      if [ "${TOOLCHAIN_REBUILD:-no}" != "yes" ] \
         && docker manifest inspect "$TOOLCHAIN_IMAGE:$TOOLCHAIN_TAG" > /dev/null 2>&1; then
        echo "$TOOLCHAIN_IMAGE:$TOOLCHAIN_TAG is published — nothing to build."
        exit 0
      fi
      docker buildx build --target toolchain \
        --cache-from "type=registry,ref=$TOOLCHAIN_IMAGE:cache" \
        --cache-to "type=registry,ref=$TOOLCHAIN_IMAGE:cache,mode=max" \
        --tag "$TOOLCHAIN_IMAGE:$TOOLCHAIN_TAG" \
        --push .

########## the documentation shape ##########
#
# A docs/ branch runs this guard and secret detection, nothing else. The guard
# is the whole reason a branch name may switch the pipeline off: a change that
# is not documentation fails here, with the files named, instead of reaching
# develop unverified. Rename the branch or split the change.

docs:only:
  stage: verify
  image: alpine:3.22
  rules:
    - if: $PIPELINE_SHAPE == "docs"
  needs: []
  variables:
    # The diff base is an ancestor the shallow default clone may not hold.
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -eu
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        base="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      else
        git fetch --quiet --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
        base="$(git merge-base origin/develop HEAD)"
      fi
      echo "documentation shape: comparing against $base"
      git diff --name-only "$base" HEAD > changed-files.txt
      offending="$(grep -vE '^(docs/|\.ai/|LICENSE$)' changed-files.txt | grep -vE '\.md$' || true)"
      if [ -n "$offending" ]; then
        echo "Not documentation, so not for a docs/ branch:" >&2
        echo "$offending" | sed 's/^/  /' >&2
        echo "Rename the branch (feat/, fix/, ci/ …) or split the change." >&2
        exit 1
      fi
      echo "$(wc -l < changed-files.txt) changed file(s), all documentation."

########## verify — the fast run (#64), and the gate on everything after ##########
#
# Split in two because one of the three checks is not like the others.
# `resources/js/{routes,actions,wayfinder}` are generated and gitignored, and
# eslint is not merely inconvenienced without them: `import/order` cannot
# resolve `@/routes/...`, files it under the wrong group, and reports eighteen
# errors that are not in the source. Generating them costs four minutes.
#
# pint and prettier need none of that. Keeping them in a separate job is what
# makes the first stage fail fast on the mistake that is actually common — a
# file nobody formatted — in about a minute and a half rather than six.

verify:format:
  stage: verify
  extends: .php-js
  variables: *offline-services
  # Tier 0: the fast lane. pint and prettier need nothing generated, so this is
  # the whole feedback loop on a feature branch push.
  rules: *tier-everywhere
  needs: [prepare:toolchain]
  # The only job that writes the caches. Everything downstream pulls what this
  # one left behind, so a green verify also means warm caches.
  cache:
    - key:
        prefix: composer
        files: [composer.lock]
      paths: [.cache/composer]
      policy: pull-push
    - key:
        prefix: npm
        files: [package-lock.json]
      paths: [.cache/npm]
      policy: pull-push
  script:
    - composer lint:check
    - npm run format:check

verify:lint:
  stage: verify
  extends: .php-js
  variables: *offline-services
  # Tier 1: four minutes of wayfinder is too much for a per-push loop.
  rules: *tier-reviewed
  needs: [prepare:toolchain]
  script:
    # --with-form matches vite.config.ts's formVariants. Generated once here
    # and handed to the jobs downstream; this is the four minutes.
    - php artisan wayfinder:generate --with-form
    - npm run lint:check
    - npm run observability:check
  artifacts:
    expire_in: 1 day
    paths:
      - resources/js/routes
      - resources/js/actions
      - resources/js/wayfinder

verify:observability:
  stage: verify
  image:
    name: victoriametrics/vmalert-tool:v1.150.0
    entrypoint: [""]
  # Tier 1, same as verify:lint: seconds of work, no toolchain. The rule file
  # is the source the chart vendors; a rule that does not fire in the unit
  # test does not ship. The image's own entrypoint runs the vmalert-tool-prod
  # binary directly, which would swallow the render step, so it is cleared
  # here and the binary is called by its full path instead.
  rules: *tier-reviewed
  needs: []
  script:
    - sh contrib/observability/render.sh konventix konventix rendered-rules
    - /vmalert-tool-prod unittest --files=rendered-rules/konventix.rules.test.yaml
  artifacts:
    when: always
    expire_in: 1 day
    paths: [rendered-rules/]

########## analyse ##########

analyse:php:
  stage: analyse
  extends: .php
  variables: *offline-services
  # Tier 0. phpstan needs neither node nor the generated routes, so it costs
  # nothing to run it on every push, in parallel with verify:format rather than
  # behind it — at 83 seconds it is cheaper than the wait would be.
  rules: *tier-everywhere
  needs: [prepare:toolchain]
  script:
    - composer types:check

analyse:js:
  stage: analyse
  extends: .js
  # Tier 1. Inherits verify:lint's generated routes and actions rather than
  # spending another four minutes producing the same files.
  rules: *tier-reviewed
  needs: [verify:lint]
  script:
    - npm run types:check

########## test ##########

test:js:
  stage: test
  extends: .js
  # Tier 0. vitest.config.ts is deliberately standalone — no Laravel, no
  # manifest, no wayfinder — so these tests need only node_modules.
  rules: *tier-everywhere
  needs: [prepare:toolchain]
  script:
    - npm run test:js

test:php:
  stage: test
  extends: .php-js
  # Tier 1, and the critical path of every merge request. It deliberately does
  # not wait for verify:lint: `npm run build:ssr` runs wayfinder itself, so
  # starting at pipeline time and generating its own copy beats idling for four
  # minutes to inherit one. Worth re-measuring now that #140 has cut the suite
  # itself: the shorter the suite, the more the wait would dominate.
  rules: *tier-reviewed
  needs: [prepare:toolchain]
  # The suite runs against PostgreSQL, not SQLite: phpunit.xml overrides
  # DB_DATABASE and nothing else, so the connection stays pgsql. Several tests
  # depend on that on purpose — Resources' exclusion constraints (ADR-0020) and
  # the `UNIQUE NULLS NOT DISTINCT` retention rules have no SQLite equivalent.
  services:
    - name: postgres:17
      alias: postgres
      # `--parallel` below runs one `migrate:fresh` per worker at the same
      # time, and dropping ~120 tables in a single transaction needs more lock
      # slots than Postgres's default of 64 per transaction leaves for eight
      # of them: 81 tests died with "out of shared memory … increase
      # max_locks_per_transaction" before this. compose.yaml sets the same on
      # the dev stack's pgsql.
      command: ["postgres", "-c", "max_locks_per_transaction=512"]
    - name: redis:7-alpine
      alias: redis
  variables:
    POSTGRES_DB: testing
    POSTGRES_USER: konventix
    POSTGRES_PASSWORD: password
    # Laravel's Dotenv is immutable: a real environment variable wins over the
    # .env copied above, which still carries the compose hostnames.
    DB_HOST: postgres
    DB_DATABASE: testing
    DB_USERNAME: konventix
    DB_PASSWORD: password
    REDIS_HOST: redis
  script:
    # The runner only waits for the service port to open; Postgres accepts a
    # connection slightly before initdb has handed over the database.
    - |
      for i in $(seq 1 30); do
        php -r 'new PDO("pgsql:host=postgres;dbname=testing", "konventix", "password");' 2>/dev/null && break
        sleep 1
      done
    # Feature tests resolve Inertia pages through the Vite manifest, so the
    # build has to precede the suite or every page test 500s. The Vite plugin
    # generates wayfinder as part of this, which is what lets the job stand on
    # its own instead of waiting for verify:lint's artifact. The SSR bundle is
    # built too: SettingsLayoutTest asserts server-rendered HTML, which only
    # exists when an SSR process answers (config/inertia.php has SSR on by
    # default, ADR-0049 §6).
    - npm run build:ssr
    # Backgrounded so it outlives this command; the runner reaps it at job end.
    # Inertia falls back to client rendering while it warms up, so the sleep is
    # what makes the first suite request deterministic.
    - nohup php artisan inertia:start-ssr > ssr.log 2>&1 &
    - sleep 3
    # Laravel gives every worker its own database, testing_test_1…n, created
    # and migrated beside `testing`; nothing in the suite shares state across
    # workers (the invoice disk is faked per worker, the numbering probe hands
    # its child the resolved database name, the Redis test keys by ULID).
    # Before: 581s of suite on one core in pipeline 1609, 2265 tests.
    #
    # Six workers, not one per core. Paratest hands out whole *files*, so the
    # suite can never finish before its slowest file, and
    # tests/Feature/SeedDemoDataCommandTest.php alone takes 92s of the 538s
    # the 269 files add up to (#262). Measured on an idle 24-core machine:
    # 4 workers 91s, 8 workers 91s, 12 workers 92s, 16 workers 84s, 24
    # workers 97s. Everything from four upwards is the same number, because
    # from there the rest of the suite already hides behind that one file.
    # Six leaves a little headroom and stops a 16-core runner from spawning
    # sixteen workers, and sixteen Postgres databases, for nothing — the
    # runners are shared, and a job that grabs every core slows the jobs
    # beside it. Raise this when #262 lowers the floor, not before.
    - |
      procs=$(nproc)
      [ "$procs" -gt 6 ] && procs=6
      php artisan test --parallel --processes="$procs"
  artifacts:
    when: always
    expire_in: 1 week
    paths: [ssr.log]

########## scan ##########
#
# Every job in this section is manual and advisory except `secret_detection`,
# which is automatic and advisory (see the top of this file). The scanners
# need neither the toolchain image nor a green verify, so they carry
# `needs: []` and are playable from the start. `scan:gate` is what turns
# their reports into a verdict: the analyzers themselves exit 0 with
# findings, and their allow_failure only covers the analyzer crashing. The
# verdict blocks nothing — `publish:image` stopped needing it — but the gate
# keeps its bars, so pressing the scanners and then the gate on a tag gives
# exactly the answer a release used to be held on.
#
# The GitLab-native alternative is a merge request approval policy (Ultimate),
# which requires approval instead of failing the pipeline. It lives in a
# separate security policy project and would be invisible from this repository;
# this gate is in the file everyone already reads.

secret_detection:
  stage: scan
  # The one scanner that still runs on its own: sixteen seconds, on every
  # push including a docs/ branch, because a README with a real key is the
  # finding the fleet repository actually had. Its report feeds the security
  # widget; the verdict on it is `scan:gate`, which is manual like every
  # other gate, so a finding here is visible rather than blocking.
  rules:
    - if: $PIPELINE_SHAPE == "docs"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH
  needs: []
  allow_failure: true

gitlab-advanced-sast:
  stage: scan
  # Manual. Twenty-seven to fifty minutes for the cross-file taint analysis,
  # which is the part worth having and the part no hardware shortens. It used
  # to run on its own on every candidate and release tag and block the
  # promotion through `scan:gate`; now it runs when pressed, on the tag that
  # is about to reach other people, and its findings land in the security
  # widget. Press it, then `scan:gate`, and the old verdict is back.
  #
  # Not in the same pipeline as `semgrep-sast`: both write gl-sast-report.json
  # and the gate reads whichever landed last. Pick one per pipeline.
  rules: *tier-scan
  needs: []
  allow_failure: true
  # The template keys the chunking metrics (`scan_metrics.csv`) by ref, with the
  # default branch as fallback — and develop never runs this job, so every tag
  # started from nothing and the analyzer logged "falling back to random
  # chunking". Pipeline 9683 (v0.5.3) shows what that costs: six groups of
  # ~445 rules each, three finishing in 8-10 minutes and three in 47-50, the
  # job as long as its slowest group. One key for every run lets each tag
  # inherit the metrics of the last and balance the groups; the sum of the
  # six groups' wall time was 172 minutes, which balanced over six cores is
  # under 30. The first tag after this change still seeds the cache.
  cache:
    key: scan-metrics-advanced-sast
    paths:
      - scan_metrics.csv
  variables:
    # The analyzer's own log: "Detected 8 cores but using 3; set --multi-core
    # or MAX_UNVERIFIED_CORES for more". On three cores a full cross-file scan
    # of this repository takes ~25 minutes and is the pipeline's critical path
    # — longer than the entire test suite. Six of the eight leaves headroom for
    # the other jobs sharing the host.
    SAST_SCANNER_ALLOWED_CLI_OPTS: "--multi-core 6"
    MAX_UNVERIFIED_CORES: "6"
    # Incremental scanning: the analyzer keeps its taint signatures in
    # `ts-cache.sqlite.gz` (the template already lists it as an artifact) and
    # looks back through previous commits for a successful pipeline that
    # carries one, reusing the signatures of unchanged files. A release tag is
    # the same commit as its candidate, so it should find the candidate's
    # cache and reanalyse nothing. Unmeasured until the next candidate and
    # release pair: the job log says "ts-cache.sqlite.gz: no matching files"
    # while this is off, and how far back it looks is the analyzer's default
    # (three days) — a candidate that ages past that pays the full scan again.
    GITLAB_ADV_SAST_INCR_SCAN: "true"

semgrep-sast:
  stage: scan
  # Manual. The cheap SAST: single-file pattern matching, no cross-file
  # dataflow, about a minute. Same report file as `gitlab-advanced-sast`, so
  # one or the other per pipeline, never both.
  rules: *tier-scan
  needs: []
  allow_failure: true

gemnasium-dependency_scanning:
  stage: scan
  # Manual. A few minutes over both lockfiles; worth pressing after a
  # dependency bump and on a tag.
  rules: *tier-scan
  needs: []
  allow_failure: true
  # The template lists gl-dependency-scanning-report.json only under
  # artifacts:reports, and a report-type artifact cannot be downloaded by a
  # later job — so scan:gate saw "no report" and passed. Secret detection and
  # both SAST analyzers list their JSON under paths, which is why only this one
  # went missing. Re-declaring artifacts replaces the key wholesale, so the
  # reports have to be repeated here or the security dashboard loses them.
  artifacts:
    access: developer
    reports:
      dependency_scanning: [gl-dependency-scanning-report.json]
      cyclonedx: ['**/gl-sbom-*.cdx.json']
    paths:
      - gl-dependency-scanning-report.json
      - '**/gl-sbom-*.cdx.json'

scan:gate:
  stage: scan
  image: alpine:3.22
  # Manual, like the scanners it reads. Press the scanners first: a report
  # that is not there fails this job, on purpose (see `require` below), so
  # the gate can never wave through a scan that did not happen. Its verdict
  # is the same as it always was — any secret, High and above with a fix in
  # code and dependencies — and it blocks nothing: `publish:image` no longer
  # needs it. On a feature branch or a docs/ branch only secret detection
  # exists, so the gate checks only that.
  rules:
    - if: $PIPELINE_SHAPE == "docs"
      when: manual
      variables:
        GATE_SECRETS_ONLY: "yes"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
    - if: $CI_COMMIT_BRANCH
      when: manual
      variables:
        GATE_SECRETS_ONLY: "yes"
  allow_failure: true
  needs:
    # Optional throughout: which analyzers a commit produces depends on the
    # files it touches, and a scanner that did not run is not a finding.
    - job: secret_detection
      artifacts: true
      optional: true
    - job: gitlab-advanced-sast
      artifacts: true
      optional: true
    - job: semgrep-sast
      artifacts: true
      optional: true
    - job: gemnasium-dependency_scanning
      artifacts: true
      optional: true
  before_script:
    - apk add --no-cache jq
  script:
    - |
      set -eu
      status=0

      # A missing report fails the gate. It used to print "no report" and carry
      # on, which is how dependency scanning went unchecked for a whole run: the
      # job was green, the file never arrived, and the gate waved it through. A
      # scanner that cannot hand over its findings is indistinguishable from one
      # that found nothing, so it has to be treated as the worse of the two.
      require() {
        [ -f "$1" ] && return 0
        echo "MISSING: $1 — no scanner handed this over." >&2
        echo "  Check that the producing job ran and lists the file under artifacts:paths;" >&2
        echo "  a report declared only under artifacts:reports cannot be downloaded." >&2
        status=1
        return 1
      }

      # A secret in the tree is a secret whatever its severity says: any
      # finding fails. This is the case the issue asks a human to prove by
      # committing a dummy credential into a merge request.
      if require gl-secret-detection-report.json; then
        n=$(jq '[.vulnerabilities[]] | length' gl-secret-detection-report.json)
        echo "secret detection: $n finding(s)"
        if [ "$n" -gt 0 ]; then
          jq -r '.vulnerabilities[] | "  \(.location.file):\(.location.start_line // 0)  \(.name)"' \
            gl-secret-detection-report.json
          status=1
        fi
      fi

      if [ "${GATE_SECRETS_ONLY:-no}" = "yes" ]; then
        echo "secret detection only: the rest runs from a merge request on, and never in the documentation shape."
        exit "$status"
      fi

      # Code findings block at High and above. Lower severities are reported in
      # the merge request's security widget and triaged there — a steady drip of
      # Low findings must not be able to stop every merge in the repository.
      # There is no notion of a fix in a SAST finding, so nothing here is
      # exempt: the code is ours, and the fix is the change.
      if require gl-sast-report.json; then
        n=$(jq '[.vulnerabilities[] | select(.severity == "Critical" or .severity == "High")] | length' gl-sast-report.json)
        total=$(jq '[.vulnerabilities[]] | length' gl-sast-report.json)
        echo "gl-sast-report.json: $n of $total finding(s) at High or above"
        if [ "$n" -gt 0 ]; then
          jq -r '.vulnerabilities[] | select(.severity == "Critical" or .severity == "High")
                 | "  [\(.severity)] \(.location.file // "-"):\(.location.start_line // 0)  \(.name)"' \
            gl-sast-report.json
          status=1
        fi
      fi

      # Dependency findings block at High and above **when a fix exists**, and
      # are informational when none does (#256, pipeline 1674). A finding whose
      # analyzer offers no remediation cannot be acted on by merging anything:
      # blocking on it stops every merge in the repository until a third party
      # ships a release, which is not a security decision but a hostage
      # situation. `solution` is the field that carries the remediation
      # ("Upgrade to versions 3.3.18, 5.1.6 or above."); empty or absent means
      # no fixed version was known when the report was written. The same rule
      # is applied to the container report in `scan:gate:image`, at Critical
      # rather than High (#256's criterion, and those OS packages are not
      # ours to fix); it cannot be read here, because that report exists only
      # after the image is published. Move the rule in both gates or in neither.
      if require gl-dependency-scanning-report.json; then
        total=$(jq '[.vulnerabilities[]] | length' gl-dependency-scanning-report.json)
        blocking=$(jq '[.vulnerabilities[] | select((.severity == "Critical" or .severity == "High") and ((.solution // "") != ""))] | length' gl-dependency-scanning-report.json)
        unfixed=$(jq '[.vulnerabilities[] | select((.severity == "Critical" or .severity == "High") and ((.solution // "") == ""))] | length' gl-dependency-scanning-report.json)
        echo "gl-dependency-scanning-report.json: $blocking with a fix, $unfixed without, at High or above; $total finding(s) in total"

        if [ "$unfixed" -gt 0 ]; then
          echo "  unfixed, not blocking (no fixed version in the report):"
          jq -r '.vulnerabilities[] | select((.severity == "Critical" or .severity == "High") and ((.solution // "") == ""))
                 | "    [\(.severity)] \(.location.dependency.package.name // "-") \(.location.dependency.version // "")  \(([.identifiers[]? | select(.type == "cve") | .value] | first) // "-")  \(.name // "-")"' \
            gl-dependency-scanning-report.json
        fi

        if [ "$blocking" -gt 0 ]; then
          echo "  blocking (a fixed version exists):"
          jq -r '.vulnerabilities[] | select((.severity == "Critical" or .severity == "High") and ((.solution // "") != ""))
                 | "    [\(.severity)] \(.location.dependency.package.name // "-") \(.location.dependency.version // "")  \(([.identifiers[]? | select(.type == "cve") | .value] | first) // "-")  \(.name // "-")\n      \(.solution)"' \
            gl-dependency-scanning-report.json
          status=1
        fi
      fi

      exit "$status"

########## build ##########

build:image:
  stage: build
  extends: .docker
  rules:
    # From develop onwards the image is always built and published: that is what
    # gives a staging instance something immutable to track (#82) and what keeps
    # the Dockerfile continuously proven instead of only at release. A docs/
    # merge request may touch docker/README.md, which `changes` below would
    # take for a Dockerfile change — so the shape is read first.
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_COMMIT_TAG
      variables:
        PUBLISH_IMAGE: "yes"
    - if: $CI_COMMIT_BRANCH == "main"
      variables:
        PUBLISH_IMAGE: "yes"
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        PUBLISH_IMAGE: "yes"
    # On a merge request only when the change could plausibly break the build.
    # A one-line Vue change cannot, and making every review wait ten minutes to
    # prove that again is the single biggest thing that was wrong here.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .dockerignore
        - docker/**/*
        - composer.lock
        - package-lock.json
        # A change to this file can rewrite the build job itself, which is
        # exactly the change most likely to break it — and the one nothing
        # else in a merge request pipeline would catch, because the shapes
        # that publish an image are develop's and a tag's, not a review's.
        - .gitlab-ci.yml
  # Nothing here comes from the rest of the pipeline: the Dockerfile builds
  # from the source tree and generates its own routes and bundle inside. The
  # `needs:` list this job used to carry — verify, analyse, test, scan:gate —
  # was not a data dependency, it was the gate that kept an unproven image out
  # of the registry, and it put the two longest jobs in the pipeline in series:
  # ~400s of Pest suite and then ~830s of build on every push to develop.
  #
  # The gate is now `publish:image`, which is the job that gives the image a
  # name something can deploy. This one starts with the pipeline and pushes
  # only to $UNVERIFIED_IMAGE, so a red test still means no deployable tag was
  # ever written — the image is simply left where nothing pulls from. What the
  # change costs is a runner slot held on suspicion, and the runners are the
  # scarce resource here; on develop and on tags the verification has already
  # passed on the merge request, so the build is very rarely thrown away.
  needs: []
  script:
    # Built once, into dind's daemon, under the staging name: the image the
    # smoke test boots is the one `publish:image` promotes, so what reaches a
    # deployment is what was proven here rather than a second build of the
    # same source.
    - |
      # Only a pipeline that publishes the image writes the cache. `mode=max`
      # uploads every intermediate layer and cost minutes of the first run's
      # 1024s; on a merge request, which pushes nothing, that is work thrown
      # away. Reading the cache is free either way.
      cache_to=
      if [ -n "${PUBLISH_IMAGE:-}" ]; then
        cache_to="--cache-to type=registry,ref=$CI_REGISTRY_IMAGE/cache:build,mode=max"
      fi
      # Built and smoked under the staging name, never under the deployable
      # one: $CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG is what a deployment pulls
      # (ADR-0049 §1) and only `publish:image` may write it, so that name does
      # not exist in this job even locally.
      # shellcheck disable=SC2086
      docker buildx build \
        --load \
        --tag "$UNVERIFIED_IMAGE:$IMAGE_SHA_TAG" \
        --build-arg "APP_VERSION=${CI_COMMIT_TAG:-$CI_COMMIT_SHA}" \
        --build-arg "SENTRY_RELEASE=$CI_COMMIT_SHA" \
        --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/cache:build" \
        $cache_to \
        .
    # The cheapest honest proof the artifact starts (ADR-0049 §1). As written
    # /up contacts neither Postgres nor Redis — AUTO_MIGRATE=false and nothing
    # touches the database at boot — so no database runs beside it here; the
    # variables stay set so a future /up that does reach for one fails loudly
    # instead of passing on an unconfigured connection. REVERB_APP_ID/KEY/SECRET
    # are present-and-empty on purpose: routes/channels.php builds the Pusher
    # client at boot and its string parameters are a fatal TypeError on null.
    - |
      docker run -d --rm --name smoke \
        -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
        -e APP_ENV=production -e APP_DEBUG=false \
        -e DB_HOST=postgres -e DB_DATABASE=konventix \
        -e DB_USERNAME=konventix -e DB_PASSWORD=password \
        -e REDIS_HOST=redis -e SESSION_DRIVER=redis \
        -e CACHE_STORE=redis -e QUEUE_CONNECTION=redis \
        -e REVERB_APP_ID= -e REVERB_APP_KEY= -e REVERB_APP_SECRET= \
        -e INERTIA_SSR_ENABLED=false -e AUTO_MIGRATE=false -e LOG_CHANNEL=stderr \
        "$UNVERIFIED_IMAGE:$IMAGE_SHA_TAG"
      ok=
      for i in $(seq 1 20); do
        docker exec smoke curl -sf http://localhost:8000/up && ok=1 && break
        sleep 3
      done
    # #254: the runtime image loads docker/php.ini as 99-production.ini. The
    # container build is the only place that can prove the COPY landed and the
    # directives took effect — a unit test can pin the file's contents, not
    # what PHP does with them. `php -i` prints "local => master"; both halves
    # have to read the same, or something later in the image overrode it.
    - |
      docker exec smoke php -i > php-i.txt
      grep -qE '^display_errors => Off => Off$' php-i.txt || { echo "display_errors is not Off in the runtime image" >&2; docker stop smoke; exit 1; }
      grep -qE '^log_errors => On => On$' php-i.txt || { echo "log_errors is not On in the runtime image" >&2; docker stop smoke; exit 1; }
      grep -qE '^expose_php => Off => Off$' php-i.txt || { echo "expose_php is not Off in the runtime image" >&2; docker stop smoke; exit 1; }
      grep -qE '^memory_limit => 512M => 512M$' php-i.txt || { echo "memory_limit is not 512M in the runtime image" >&2; docker stop smoke; exit 1; }
      grep -qE '^opcache.validate_timestamps => Off => Off$' php-i.txt || { echo "opcache.validate_timestamps is not off in the runtime image" >&2; docker stop smoke; exit 1; }
      grep -qE '^opcache.enable_cli => Off => Off$' php-i.txt || { echo "opcache.enable_cli is on, which makes validate_timestamps=0 unsafe for the entrypoint's cache calls" >&2; docker stop smoke; exit 1; }
      grep -qE '^zend.assertions => -1 => -1$' php-i.txt || { echo "zend.assertions is not -1 in the runtime image" >&2; docker stop smoke; exit 1; }
    # #257: root owns the artifact and the runtime user owns only the two
    # directories it has to write. The Dockerfile test pins the text of the
    # COPY lines; only the running container can show the result — a base image
    # that changes the WORKDIR's ownership, an `--chown` reinstated through a
    # build arg, or a source directory whose own mode keeps the runtime user out
    # (the `config/stripe` boot failure) are all invisible to a grep of the
    # Dockerfile. These run as the image's USER, uid 1000.
    - |
      docker exec smoke sh -c 'test ! -w /var/www/html/artisan' || { echo "the runtime user can write /var/www/html/artisan" >&2; docker stop smoke; exit 1; }
      docker exec smoke sh -c 'test ! -w /var/www/html' || { echo "the runtime user can create files next to the application" >&2; docker stop smoke; exit 1; }
      docker exec smoke sh -c 'test "$(stat -c %U /var/www/html/config)" = root' || { echo "/var/www/html/config is not root-owned" >&2; docker stop smoke; exit 1; }
      docker exec smoke sh -c 'test -r /var/www/html/config/app.php' || { echo "the runtime user cannot read /var/www/html/config" >&2; docker stop smoke; exit 1; }
      docker exec smoke sh -c 'test -w /var/www/html/storage' || { echo "/var/www/html/storage is not writable by the runtime user" >&2; docker stop smoke; exit 1; }
      docker exec smoke sh -c 'test "$(stat -c %U /var/www/html/storage)" = konventix' || { echo "/var/www/html/storage is not owned by the runtime user" >&2; docker stop smoke; exit 1; }
      docker exec smoke sh -c 'test -w /var/www/html/bootstrap/cache' || { echo "/var/www/html/bootstrap/cache is not writable by the runtime user" >&2; docker stop smoke; exit 1; }
    # ADR-0049 §5: the bundle must carry no baked websocket endpoint, or every
    # deployment talks to the developer's laptop. `resolveReverbEndpoint` is
    # called with `{host: …, port: …, scheme: …}` filled from VITE_REVERB_*;
    # with them stripped the minifier writes `host:void 0`, with them baked it
    # writes the .env.example value. Matching the pair rather than a bare
    # `localhost` avoids laravel-echo's own hardcoded `wsHost:"localhost"`
    # default and the SSR `hostname:"localhost"` fallback, both of which are in
    # every bundle.
    - |
      if docker exec smoke sh -c "grep -rlE 'localhost:8080|host:.?localhost.?,port:' public/build/assets/"; then
        echo "the built bundle contains the dev websocket endpoint" >&2
        docker stop smoke
        exit 1
      fi
      docker logs smoke | tail -40
      docker stop smoke
      test "$ok" = "1"
    - |
      if [ -n "${PUBLISH_IMAGE:-}" ]; then
        # Parked, not published. `publish:image` names this same manifest a
        # second time once the gate is green, so what ships is the image the
        # smoke test just booted rather than a second build of the source.
        docker push "$UNVERIFIED_IMAGE:$IMAGE_SHA_TAG"
      else
        echo "merge request pipeline: image built and smoked, deliberately neither parked nor published."
      fi

container_scanning:
  stage: publish
  # The published tag, so what is scanned is what a deployment can pull — and
  # after `publish:image`, which deletes the staging tag it promoted from.
  needs:
    - job: publish:image
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG
  # Manual, and only where an image was actually published — a merge
  # request's image is built and smoked and goes no further, so there the
  # job does not appear at all. The play button lights up once
  # `publish:image` has written the tag this scans.
  rules:
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  # The analyzer itself never fails a pipeline: a report full of CVEs is a
  # successful job, and `scan:gate:image` is the job that reads it.
  allow_failure: true
  # The template lists the report only under artifacts:reports, and a
  # report-type artifact cannot be downloaded by a later job — the same trap
  # that left dependency scanning unchecked for a whole run. Re-declaring
  # artifacts replaces the key wholesale, so the reports are repeated here or
  # the security dashboard loses them.
  artifacts:
    access: developer
    reports:
      container_scanning: gl-container-scanning-report.json
      cyclonedx: ['**/gl-sbom-*.cdx.json']
    paths:
      - gl-container-scanning-report.json
      - '**/gl-sbom-*.cdx.json'

# The second half of scan:gate, and a separate job only because it cannot be
# the same one: `build:image` has `needs: [scan:gate]`, and container scanning
# needs the image build, so folding the container report into scan:gate would
# close a cycle. The missing-report rule and the jq are scan:gate's, verbatim.
#
# The bar is **Critical**, which is what #256's criterion asks for, and it is
# one notch above scan:gate's High for a reason worth writing down: scan:gate
# judges code and dependencies this repository owns and can fix, while this
# report is dominated by the Debian package set of
# `dunglas/frankenphp:1-php8.5-bookworm`, which the analyzer reports including
# CVEs Debian has not fixed. A stable base image with zero High findings is the
# exception; blocking there would mean the only way to cut a release is to edit
# this file on the release branch. High findings are printed here and triaged in
# the merge request's security widget — the same waiver scan:gate uses for
# everything under its own bar, and the only one either gate has: there is no
# allowlist file in this repository, and neither gate may grow one alone.
#
# And a Critical only blocks when it can be acted on. Pipeline 1674 (v0.5.4)
# was stopped by seventeen Criticals in libsqlite3-0, libxml2, linux-libc-dev,
# perl and zlib1g, every one of them with an empty `solution`: Debian has no
# fixed package. Nothing that could be merged would have made that gate green,
# so it was not a decision, it was a hostage situation. A finding without a
# fixed version in the report is printed as informational; a Critical with one
# blocks. Same rule in `scan:gate` for the dependency report — move it in both
# or in neither.
#
# Manual, wherever `container_scanning` is, and advisory: `release:image` no
# longer waits for it. Press `container_scanning`, then this, to get the
# verdict a release tag used to be held on.
scan:gate:image:
  # Follows `container_scanning`, which #261 moved behind `publish:image` so
  # it scans the tag that exists rather than one that might not; a job cannot
  # need another from a later stage, so this moves with it.
  stage: publish
  image: alpine:3.22
  rules:
    - if: $PIPELINE_SHAPE == "docs"
      when: never
    - if: $CI_COMMIT_TAG
      when: manual
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  allow_failure: true
  needs:
    - job: container_scanning
      artifacts: true
  before_script:
    - apk add --no-cache jq
  script:
    - |
      set -eu
      status=0

      # A scanner that cannot hand over its findings is indistinguishable from
      # one that found nothing, so it counts as the worse of the two.
      if [ ! -f gl-container-scanning-report.json ]; then
        echo "MISSING: gl-container-scanning-report.json — no scanner handed this over." >&2
        echo "  Check that container_scanning ran and lists the file under artifacts:paths;" >&2
        echo "  a report declared only under artifacts:reports cannot be downloaded." >&2
        exit 1
      fi

      # This report carries no `name`; the CVE id lives in `identifiers` and the
      # package in `location.dependency`. Printing `.name` is what put a column
      # of `null` in pipeline 1674's log.
      total=$(jq '[.vulnerabilities[]] | length' gl-container-scanning-report.json)
      high=$(jq '[.vulnerabilities[] | select(.severity == "High")] | length' gl-container-scanning-report.json)
      critical=$(jq '[.vulnerabilities[] | select(.severity == "Critical")] | length' gl-container-scanning-report.json)
      blocking=$(jq '[.vulnerabilities[] | select(.severity == "Critical" and ((.solution // "") != ""))] | length' gl-container-scanning-report.json)
      unfixed=$(jq '[.vulnerabilities[] | select(.severity == "Critical" and ((.solution // "") == ""))] | length' gl-container-scanning-report.json)
      echo "gl-container-scanning-report.json: $critical Critical ($blocking with a fix, $unfixed without), $high High, $total finding(s) in total"

      # Reported, never blocking: an unfixed Debian High must not be able to
      # stop a release, but it must not go unseen either.
      if [ "$high" -gt 0 ]; then
        jq -r '.vulnerabilities[] | select(.severity == "High")
               | "  [High] \(.location.dependency.package.name // "-") \(.location.dependency.version // "")  \(([.identifiers[]? | select(.type == "cve") | .value] | first) // "-")"' \
          gl-container-scanning-report.json
      fi

      # The base image's own CVE schedule, which no merge in this repository can
      # answer. Listed in full so the release note is written from the log
      # rather than from memory (#256).
      if [ "$unfixed" -gt 0 ]; then
        echo "  unfixed, not blocking (no fixed version in the report):"
        jq -r '.vulnerabilities[] | select(.severity == "Critical" and ((.solution // "") == ""))
               | "    [Critical] \(.location.dependency.package.name // "-") \(.location.dependency.version // "")  \(([.identifiers[]? | select(.type == "cve") | .value] | first) // "-")"' \
          gl-container-scanning-report.json
      fi

      if [ "$blocking" -gt 0 ]; then
        echo "  blocking (a fixed version exists):"
        jq -r '.vulnerabilities[] | select(.severity == "Critical" and ((.solution // "") != ""))
               | "    [Critical] \(.location.dependency.package.name // "-") \(.location.dependency.version // "")  \(([.identifiers[]? | select(.type == "cve") | .value] | first) // "-")\n      \(.solution)"' \
          gl-container-scanning-report.json
        echo "A Critical finding with a fixed version blocks the promotion. Rebuild on the" >&2
        echo "  updated base image, or argue the exception on #256 and move the rule in both" >&2
        echo "  gates, never in one." >&2
        status=1
      fi

      exit "$status"

########## publish ##########
#
# The gate. Everything above proves the commit; this is the job that turns that
# proof into a name a deployment can pull, and it carries the `needs:` list
# `build:image` used to (#261). It copies a manifest and nothing else, so the
# whole gate costs seconds rather than repeating a fourteen-minute build.
#
# `scan:gate` is not in the list any more: the scanners and their gates are
# manual and advisory (see the top of this file), so what an image needs to be
# published is that it was formatted, linted, type-checked, tested and built.

publish:image:
  stage: publish
  extends: .registry
  # Wherever an image is published — develop onwards. A merge request builds
  # and smokes its image and parks nothing, so there is nothing here to promote.
  rules: *tier-published
  needs:
    - verify:format
    - verify:lint
    - analyse:php
    - analyse:js
    - test:php
    - test:js
    - build:image
  script:
    # A manifest copy, not a rebuild: the promoted tag points at the manifest
    # `build:image` smoked, same config and same layers, which is what makes
    # "the image that was tested is the image that ships" true rather than
    # approximately true. Not the same *top-level* digest, though — see
    # `release:image` below, which has always worked this way.
    #
    # Two pipelines reach this job for the same $IMAGE_SHA_TAG: a release tag
    # and the push to main sit on one commit, and both are publishing tiers.
    # They start together, so which one promotes first is a race — and the
    # loser used to die on `unverified:sha-…: not found`, because the winner
    # deleted the staging tag as tidy-up below. That is what took v0.5.6 down
    # (pipeline 1717): the image was published, `release:image` was skipped
    # behind the failure, and the release had no semver name.
    #
    # The image the loser wants is already there, put there by a run of this
    # same gated job on the same commit, so the honest answer is to say so and
    # stop rather than to build a second opinion of one commit. `release:image`
    # then copies the semver name from the sha tag either way.
    - |
      if docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG" > /dev/null 2>&1; then
        echo "$CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG is already published — an earlier pipeline on this commit promoted it. Nothing to do."
      else
        docker buildx imagetools create \
          --tag "$CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG" \
          "$UNVERIFIED_IMAGE:$IMAGE_SHA_TAG"
      fi
      docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG"
    # The staging tag has done its job. Deleting it keeps `unverified` from
    # growing one tag per published commit; the blobs are shared with the tag
    # just created, so this frees names, not storage. Best effort throughout —
    # the image is already published by this point, and a tidy-up must not be
    # able to turn that into a failed pipeline. The job token may delete tags
    # in its own project's registry, and nowhere else.
    - |
      if apk add --no-cache curl jq > /dev/null 2>&1; then
        repo_id=$(curl -sf --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories?per_page=100" \
          | jq -r '.[] | select(.name == "unverified") | .id')
      fi
      if [ -n "${repo_id:-}" ]; then
        curl -s -X DELETE --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/registry/repositories/$repo_id/tags/$IMAGE_SHA_TAG" \
          -o /dev/null -w 'delete unverified:%{http_code}\n' || true
      else
        echo "could not resolve the unverified repository; leaving $IMAGE_SHA_TAG in place."
      fi
      # A 404 here is the ordinary case for the second pipeline on a commit:
      # the first one already deleted it. Hence the best-effort shape above.

########## release ##########

release:image:
  stage: release
  # A second manifest copy, from the tag `publish:image` created, so the
  # release names the image that was built and smoked rather than a rebuild
  # of the same source. Both names exist only after the gate.
  extends: .registry
  needs:
    # Only the published tag. The promotion used to wait for
    # `scan:gate:image` (#256); that gate is manual and advisory now, so a
    # release is named as soon as its image is published, and the container
    # scan is something to press on the tag afterwards.
    - job: publish:image
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # `imagetools create` names an existing manifest a second time — the
    # release is the image that was built and smoked, not a rebuild of it.
    #
    # Whether that preserves the top-level digest depends on what it is handed.
    # A single-platform manifest gets wrapped in an OCI index on the way and
    # comes out with a new digest; an index is copied as it stands. Since #261
    # the wrap happens once, in `publish:image`, so the sha tag is already an
    # index by the time this job reads it and the release name carries the same
    # digest. The registry shows both eras: `0.5.3` is sha256:4afb57ac… against
    # its own `sha-33ce3925` at sha256:c263ef9c…, from when this job wrapped a
    # plain manifest, while `0.5.7` and `sha-f3c25e32` are both
    # sha256:a105f019…. (An index is also what a null `revision` in the tags API
    # means.) So a digest pinned against a release now resolves under either
    # name — but keep pinning the tag, which is what the chart does (#82):
    # Chart.yaml's appVersion is "0.4.0", not "v0.4.0".
    - docker buildx imagetools create
        --tag "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
        "$CI_REGISTRY_IMAGE:$IMAGE_SHA_TAG"
    - docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
